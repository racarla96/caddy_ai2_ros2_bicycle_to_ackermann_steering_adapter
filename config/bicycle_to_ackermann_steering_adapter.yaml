tricycle_steering_controller:
  ros__parameters:
    type: 'tricycle_steering_controller/TricycleSteeringController'
    wheelbase: 1.7
    traction_track_width: 1.0
    traction_wheels_radius: 0.3
    reference_timeout: 2.0 # In s. Timeout to stop if no cmd_vel is received
    traction_joints_names: ['rear_right_wheel_joint', 'rear_left_wheel_joint']
    steering_joints_names: ['bicycle_to_ackermann_steering_adapter/center_steering_joint']
    open_loop: false
    velocity_rolling_window_size: 10
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    twist_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
    pose_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
    position_feedback: false

bicycle_to_ackermann_steering_adapter:
  ros__parameters:
    type: 'bicycle_to_ackermann_steering_adapter/BicycleToAckermannSteeringAdapter'
    wheelbase: 1.7
    track_width: 1.0
    max_steer_angle: 0.4
    input_steering_name: 'center_steering_joint'
    output_steering_names: ['right_wheel_steering_joint', 'left_wheel_steering_joint']

forward_command_controller:
  ros__parameters:
    type: 'forward_command_controller/ForwardCommandController'
    joints:
      - bicycle_to_ackermann_steering_adapter/center_steering_joint
    interface_name: position